plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
}

repositories {
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JEI (optional): the API to compile the info plugin, the full mod only at runtime in dev
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // Simple Ores is REQUIRED (the tools are crafted in its Gravity Core).
    // To test in runClient, put the Simple Ores jar (26.2, Fabric) in the "libs" folder.
    localRuntime fileTree(dir: 'libs', include: '*.jar')
}

processResources {
    var replaceProperties = [
            version                 : mod_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            minecraft_version       : minecraft_version,
            loader_version          : loader_version,
            simpleores_version_range: simpleores_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
